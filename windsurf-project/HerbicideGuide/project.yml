name: LucerneHerbicides
options:
  minimumXcodeGenVersion: 2.35.0
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: 16.0
    TARGETED_DEVICE_FAMILY: 1   # iPhone only

targets:
  LucerneHerbicides:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: .
        excludes:
          - README.md
          - project.yml
          - Config/**
    resources:
      - path: Assets.xcassets
      - path: Data
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: lucerneherbicides.2025
        PRODUCT_NAME: "Lucerne Herbicides"
        INFOPLIST_FILE: Config/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
    scheme:
      testTargets: []
      gatherCoverageData: false
